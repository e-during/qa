<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>품질경영팀 PORTAL</title>
<meta name="theme-color" content="#0b1636">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="품질경영팀">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html { height: 100%; background: #060b1c; }
  body {
    min-height: 100%; min-height: 100dvh;
    display: flex; flex-direction: column;
    background: #060b1c; color: #fff;
    overflow-x: hidden; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ---------- 히어로 (사진 + 텍스트 오버레이) ---------- */
  .hero {
    position: relative; width: 100%; height: 24vh; min-height: 160px; max-height: 220px;
    padding-top: env(safe-area-inset-top);
  }
  .hero img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    object-position: center 38%;
    filter: saturate(1.05);
  }
  .hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(6,11,28,.1) 0%, rgba(6,11,28,.05) 40%, #060b1c 100%);
  }
  .status-pill {
    position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: 16px; z-index: 2;
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(6,11,28,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
    padding: 7px 12px; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,.85);
  }
  .status-pill i { width: 6px; height: 6px; border-radius: 50%; background: #10b981; box-shadow: 0 0 6px rgba(16,185,129,.7); }

  .hero-text { text-align: center; padding: 12px 20px 0; }
  .hero-sub { font-size: 10px; font-weight: 700; letter-spacing: 2.5px; color: #e0b060; }
  .hero-team { margin-top: 5px; font-size: 17px; font-weight: 900; color: #fff; letter-spacing: .3px; }

  /* ---------- 본문 ---------- */
  .content { flex: 1; display: flex; flex-direction: column; padding: 12px 20px calc(env(safe-area-inset-bottom) + 10px); }

  .menu { width: 100%; max-width: 440px; margin: 0 auto; }

  .dash-btn {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 14px;
    padding: 15px 18px 15px 16px; border-radius: 18px; text-decoration: none;
    background: linear-gradient(160deg, #1b2a54 0%, #12203f 60%, #0c1730 100%);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 16px 36px rgba(0,0,0,.5);
    transition: transform .15s ease;
  }
  .dash-btn:active { transform: scale(.98); }
  .dash-btn .icon {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(224,176,96,.22), rgba(224,176,96,.06));
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(224,176,96,.3);
  }
  .dash-btn .icon svg { width: 21px; height: 21px; }
  .dash-btn .text { flex: 1; min-width: 0; }
  .dash-btn .label { font-size: 15.5px; font-weight: 900; color: #fff; letter-spacing: .1px; }
  .dash-btn .desc { margin-top: 2px; font-size: 10.5px; font-weight: 600; color: rgba(255,255,255,.45); }
  .dash-btn .arrow {
    flex: none; width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #ff7a2f, #ff5500);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px;
    box-shadow: 0 8px 18px rgba(255,85,0,.4);
  }
  .dash-btn .watermark {
    position: absolute; bottom: 6px; right: 14px;
    font-size: 8px; font-weight: 800; letter-spacing: 1.5px; color: rgba(255,255,255,.12);
  }

  /* ---------- 가치 4개 (카드 안에 통합, 버튼 아님) ---------- */
  .values {
    display: grid; grid-template-columns: repeat(4, 1fr);
    margin: 10px auto 0; width: 100%; max-width: 440px;
    background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07);
    border-radius: 16px; padding: 11px 4px;
  }
  .value-item { text-align: center; position: relative; padding: 0 2px; }
  .value-item + .value-item::before {
    content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 1px;
    background: rgba(255,255,255,.08);
  }
  .value-item .vi { width: 24px; height: 24px; margin: 0 auto 5px; display: flex; align-items: center; justify-content: center; }
  .value-item .vi svg { width: 15px; height: 15px; stroke: #e0b060; opacity: .85; }
  .value-item .vt { font-size: 11px; font-weight: 800; color: #fff; }
  .value-item .vd { margin-top: 2px; font-size: 8px; font-weight: 600; color: rgba(255,255,255,.35); line-height: 1.3; }

  /* ---------- 개발 중인 추가 기능 미리보기 ---------- */
  .soon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px auto 0; width: 100%; max-width: 440px; }
  .soon-card {
    position: relative; padding: 12px 12px 11px; border-radius: 15px;
    background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.08);
  }
  .soon-badge {
    display: inline-block; font-size: 8px; font-weight: 800; letter-spacing: .3px;
    color: #e0b060; background: rgba(224,176,96,.12); border: 1px solid rgba(224,176,96,.3);
    border-radius: 999px; padding: 2px 6px; margin-bottom: 7px;
  }
  .soon-card .si {
    width: 26px; height: 26px; border-radius: 8px; margin-bottom: 7px;
    background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center;
  }
  .soon-card .si svg { width: 14px; height: 14px; stroke: rgba(255,255,255,.6); }
  .soon-card .st { font-size: 12.5px; font-weight: 800; color: #fff; }
  .soon-card .sd { margin-top: 2px; font-size: 9px; font-weight: 600; color: rgba(255,255,255,.35); line-height: 1.4; }

  .credit { margin-top: auto; padding-top: 12px; text-align: center; }
  .credit .line { width: 30px; height: 1px; background: rgba(255,255,255,.14); margin: 0 auto 8px; }
