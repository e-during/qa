<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<script src="js/gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>품질경영팀 PORTAL</title>
<meta name="theme-color" content="#0b1636">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="품질경영팀">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html { height: 100%; background: #060b1c; }
  body {
    min-height: 100%; min-height: 100dvh;
    display: flex; flex-direction: column;
    background: #060b1c; color: #fff;
    overflow-x: hidden; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ---------- 히어로 (사진 + 텍스트 오버레이) ---------- */
  .hero {
    position: relative; width: 100%; height: 24vh; min-height: 160px; max-height: 220px;
    padding-top: env(safe-area-inset-top);
  }
  .hero img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    object-position: center 38%;
    filter: saturate(1.05);
  }
  .hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(6,11,28,.1) 0%, rgba(6,11,28,.05) 40%, #060b1c 100%);
  }
  .status-pill {
    position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: 16px; z-index: 2;
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(6,11,28,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
    padding: 7px 12px; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,.85);
  }
  .status-pill i { width: 6px; height: 6px; border-radius: 50%; background: #10b981; box-shadow: 0 0 6px rgba(16,185,129,.7); }

  .hero-text { text-align: center; padding: 16px 20px 0; }
  .hero-sub { font-size: 10px; font-weight: 700; letter-spacing: 2.5px; color: #e0b060; }
  .hero-team { margin-top: 8px; font-size: 20px; font-weight: 900; color: #fff; letter-spacing: .3px; }

  /* ---------- 본문 ---------- */
  .content { flex: 1; display: flex; flex-direction: column; padding: 16px 20px calc(env(safe-area-inset-bottom) + 8px); }

  .menu { width: 100%; max-width: 440px; margin: 0 auto; }

  .dash-btn {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 16px;
    padding: 20px 20px 20px 16px; border-radius: 16px; text-decoration: none;
    background: #101c38;
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
    transition: transform .15s ease, border-color .15s ease;
  }
  .dash-btn:active { transform: scale(.98); }
  .dash-btn .icon {
    flex: none; width: 44px; height: 44px; border-radius: 12px;
    background: rgba(224,176,96,.10);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(224,176,96,.25);
  }
  .dash-btn .icon svg { width: 22px; height: 22px; }
  .dash-btn .text { flex: 1; min-width: 0; }
  .dash-btn .label { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: .1px; }
  .dash-btn .desc { margin-top: 4px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,.4); }
  .dash-btn .arrow {
    flex: none; display: flex; align-items: center; gap: 3px;
    color: #e0b060; font-weight: 700; font-size: 11px; letter-spacing: .2px;
    transition: transform .15s ease;
  }
  .dash-btn .arrow svg { width: 14px; height: 14px; transition: transform .15s ease; }
  .dash-btn:hover .arrow svg, .dash-btn:active .arrow svg { transform: translateX(3px); }
  .dash-btn .watermark {
    position: absolute; bottom: 8px; right: 16px;
    font-size: 8px; font-weight: 800; letter-spacing: 1.5px; color: rgba(255,255,255,.10);
  }

  /* ---------- 2026-10-01 메인 개편: 날짜 · 가치 한 줄 · 2×2 메뉴 격자 ---------- */
  .hero-date { font-size: 10.5px; font-weight: 800; letter-spacing: 2px; color: #e0b060; }
  .values-line { margin-top: 10px; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .values-line span {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,.55);
    padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
  }
  .values-line svg { width: 11px; height: 11px; stroke: #e0b060; opacity: .85; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px auto 0; width: 100%; max-width: 440px; }
  .tile {
    position: relative; display: flex; flex-direction: column; justify-content: space-between;
    min-height: 116px; padding: 14px 14px 13px; border-radius: 16px; text-decoration: none;
    background: #101c38; border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 6px 16px rgba(0,0,0,.28);
    transition: transform .12s ease, border-color .15s ease, background .15s ease;
  }
  .tile:active { transform: scale(.97); background: #13234a; border-color: rgba(224,176,96,.35); }
  .tile .ti {
    width: 40px; height: 40px; border-radius: 12px;
    background: rgba(224,176,96,.10); box-shadow: inset 0 0 0 1px rgba(224,176,96,.25);
    display: flex; align-items: center; justify-content: center;
  }
  .tile .ti svg { width: 21px; height: 21px; stroke: #e0b060; }
  .tile .chev { position: absolute; top: 14px; right: 12px; width: 16px; height: 16px; stroke: rgba(255,255,255,.28); }
  .tile .tt { margin-top: 14px; font-size: 15px; font-weight: 800; color: #fff; letter-spacing: -.2px; word-break: keep-all; }
  .tile .td { margin-top: 3px; font-size: 10.5px; font-weight: 600; color: rgba(255,255,255,.42); line-height: 1.35; word-break: keep-all; }
  /* 현장 마킹: 카메라를 바로 여는 기능이라 금색으로 강조 */
  .tile.gold { background: linear-gradient(135deg, #ecc47c, #d9a24a); border-color: transparent; box-shadow: 0 8px 20px rgba(224,176,96,.25); }
  .tile.gold:active { background: linear-gradient(135deg, #e6b968, #cf963c); }
  .tile.gold .ti { background: rgba(26,18,6,.12); box-shadow: inset 0 0 0 1px rgba(26,18,6,.18); }
  .tile.gold .ti svg { stroke: #1a1206; }
  .tile.gold .chev { stroke: rgba(26,18,6,.4); }
  .tile.gold .tt { color: #1a1206; }
  .tile.gold .td { color: rgba(26,18,6,.62); }
  /* 툴박스를 아직 안 들어가 본 폰에서만 NEW 점 */
  .new-dot { position: absolute; top: 12px; right: 30px; font-size: 8.5px; font-weight: 900; letter-spacing: .5px; color: #060b1c; background: #e0b060; border-radius: 999px; padding: 2px 6px; display: none; }
  .tile.nudge .new-dot { display: block; animation: nd 1.8s ease-in-out infinite; }
  @keyframes nd { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

  .dash-btn .label, .dash-btn .desc { word-break: keep-all; }
  .content { padding-bottom: calc(env(safe-area-inset-bottom) + 18px); }
  @media (max-width: 380px) { .dash-btn .arrow span { display: none; } .dash-btn { gap: 12px; } .tile { min-height: 106px; } .tile .tt { font-size: 14px; } }
  .credit { margin-top: 18px; text-align: center; }
  .credit .line { width: 30px; height: 1px; background: rgba(255,255,255,.14); margin: 0 auto 8px; }
  .credit p { font-size: 9.5px; color: rgba(255,255,255,.3); font-weight: 600; line-height: 1.5; letter-spacing: .2px; }
  .credit a { color: rgba(255,255,255,.35); text-decoration: none; }

  /* ---------- 2026-10-01 v3: 절제된 톤 — 남색 단색 + 금색 포인트 하나, 위계는 크기·밝기로 ---------- */
  body { background: linear-gradient(180deg, #08102a 0%, #060b1c 55%) no-repeat, #060b1c; }

  /* 가치: 박스 없이 한 줄 텍스트 */
  .values-line { gap: 0; margin-top: 8px; }
  .values-line span { background: none; border: none; padding: 0 9px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,.45); letter-spacing: .5px; position: relative; }
  .values-line span + span::before { content: ''; position: absolute; left: -1.5px; top: 50%; width: 3px; height: 3px; margin-top: -1.5px; border-radius: 50%; background: rgba(224,176,96,.55); }
  .values-line svg { display: none; }

  /* 대시보드: 유일한 강조 카드 */
  .dash-btn {
    padding: 18px 16px; border-radius: 18px; gap: 14px;
    background: linear-gradient(180deg, #15244d 0%, #101c3d 100%);
    border: 1px solid rgba(224,176,96,.32);
    box-shadow: 0 10px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .dash-btn .icon { width: 48px; height: 48px; border-radius: 14px; background: #e0b060; box-shadow: none; }
  .dash-btn .icon svg { width: 23px; height: 23px; stroke: #10182f; }
  .dash-btn .label { font-size: 16.5px; }
  .dash-btn .desc { color: rgba(255,255,255,.45); }
  .dash-btn .live { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 800; letter-spacing: 1px; color: rgba(255,255,255,.5); margin-bottom: 3px; }
  .dash-btn .live i { width: 5px; height: 5px; border-radius: 50%; background: #34d399; }
  .dash-btn .arrow { width: auto; height: auto; background: none; border: none; color: rgba(224,176,96,.9); }
  .dash-btn .arrow svg { width: 18px; height: 18px; }
  .dash-btn .watermark { display: none; }

  /* 섹션 라벨 */
  .sec-label { width: 100%; max-width: 440px; margin: 20px auto 0; font-size: 10.5px; font-weight: 800; letter-spacing: 1.6px; color: rgba(255,255,255,.32); }
  .grid { margin-top: 10px; }

  /* 2×2: 모두 같은 중립 카드, 아이콘은 금색 선 */
  .tile {
    min-height: 108px; border-radius: 16px; padding: 14px;
    background: #0f1934; border: 1px solid rgba(255,255,255,.07);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
  }
  .tile:active { background: #13204a; border-color: rgba(224,176,96,.3); transform: scale(.98); }
  .tile .ti { width: 38px; height: 38px; border-radius: 11px; background: rgba(224,176,96,.08); box-shadow: inset 0 0 0 1px rgba(224,176,96,.22); }
  .tile .ti svg { width: 19px; height: 19px; stroke: #e0b060; }
  .tile .chev { stroke: rgba(255,255,255,.22); width: 15px; height: 15px; }
  .tile .tt { margin-top: 12px; font-size: 14.5px; }
  .tile .td { color: rgba(255,255,255,.4); font-size: 10.5px; }
  .tile.gold { background: #0f1934; border: 1px solid rgba(255,255,255,.07); box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
  .tile.gold:active { background: #13204a; }
  .tile.gold .ti { background: rgba(224,176,96,.08); box-shadow: inset 0 0 0 1px rgba(224,176,96,.22); }
  .tile.gold .ti svg { stroke: #e0b060; }
  .tile.gold .tt { color: #fff; }
  .tile.gold .td { color: rgba(255,255,255,.4); }
  .tile.gold .chev { stroke: rgba(255,255,255,.22); }
  .new-dot { top: 15px; right: 32px; padding: 0; width: 6px; height: 6px; font-size: 0; background: #e0b060; border-radius: 50%; animation: none !important; }
  @media (max-width: 380px) { .sec-label { margin-top: 16px; } .tile { min-height: 100px; } .credit { margin-top: 14px; } .content { padding-bottom: calc(env(safe-area-inset-bottom) + 8px); } }
  /* ---------- 2026-10-01 오늘 줄 v2: 카드 하나 + 칸 나눔 · 이모지 대신 선 아이콘 ---------- */
  .today-strip { width: 100%; max-width: 440px; margin: 0 auto 10px; display: none; align-items: stretch;
    background: #0f1934; border: 1px solid rgba(255,255,255,.07); border-radius: 16px; overflow: hidden; }
  .today-strip.on { display: flex; }
  .ts-next { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; text-decoration: none; }
  .ts-time { flex: none; font-size: 15px; font-weight: 900; color: #e0b060; letter-spacing: .3px; font-variant-numeric: tabular-nums; }
  .ts-time.none { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.35); letter-spacing: 0; }
  /* [2026-10-07] '종일'은 시간 숫자보다 가볍게: 작은 배지 */
  .ts-time.allday { font-size: 11px; font-weight: 800; letter-spacing: 0; line-height: 1; padding: 4px 8px; border-radius: 999px; border: 1px solid rgba(224,176,96,.45); background: rgba(224,176,96,.1); }
  .ts-txt { min-width: 0; }
  .ts-k { font-size: 9.5px; font-weight: 800; letter-spacing: 1.2px; color: rgba(255,255,255,.32); }
  .ts-t { margin-top: 1px; font-size: 14.5px; font-weight: 800; color: rgba(255,255,255,.88); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ts-side { flex: none; display: flex; align-items: stretch; border-left: 1px solid rgba(255,255,255,.07); }
  .ts-cell { width: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    text-decoration: none; background: none; border: none; font-family: inherit; cursor: pointer; color: rgba(255,255,255,.45); }
  .ts-cell + .ts-cell { border-left: 1px solid rgba(255,255,255,.07); }
  .ts-cell svg { width: 18px; height: 18px; stroke: rgba(224,176,96,.75); }
  .ts-cell span { font-size: 9.5px; font-weight: 800; letter-spacing: .3px; }
  .ts-cell b { color: #e0b060; }
  .ts-cell.on { background: rgba(224,176,96,.12); color: #e0b060; }
  .ts-cell.on svg { stroke: #e0b060; }
  .ts-next:active, .ts-cell:active { background: rgba(255,255,255,.04); }
  @media (max-width: 380px) { body:has(.today-strip.on) .tile { min-height: 92px; } body:has(.today-strip.on) .sec-label { margin-top: 12px; } body:has(.today-strip.on) .credit { margin-top: 10px; } .ts-cell { width: 46px; } .ts-next { padding: 8px 10px 8px 12px; } .today-strip { margin-bottom: 8px; } body:has(.today-strip.on) .values-line { margin-top: 6px; } }
  /* ---------- 2026-10-01 세로 압축: 날짜·가치 줄 제거 · 대시보드 카드 낮춤 ---------- */
  .hero-text { padding-top: 12px; }
  .hero-team { margin-top: 0; }
  .content { padding-top: 12px; }
  .dash-btn { padding: 12px 14px; border-radius: 16px; }
  .dash-btn .icon { width: 40px; height: 40px; border-radius: 12px; }
  .dash-btn .icon svg { width: 20px; height: 20px; }
  .dash-btn .live { margin-bottom: 1px; }
  .dash-btn .label { font-size: 15.5px; }
  .dash-btn .desc { margin-top: 2px; }
  .sec-label { margin-top: 14px; }
  /* ---------- 2026-10-01 배너 사진 안 잘리게 (16:9 그대로) + 아래 카드 높이로 보정 ---------- */
  .hero { height: auto; min-height: 0; max-height: none; aspect-ratio: 16 / 9; }
  .hero::after { background: linear-gradient(180deg, rgba(6,11,28,0) 70%, #060b1c 100%); }
  .hero-text { padding-top: 6px; }
  .content { padding-top: 10px; }
  .tile { min-height: 96px; padding: 12px; }
  .tile .ti { width: 34px; height: 34px; border-radius: 10px; }
  .tile .ti svg { width: 17px; height: 17px; }
  .tile .tt { margin-top: 10px; font-size: 14px; }
  .grid { gap: 8px; }
  .sec-label { margin-top: 12px; }
  .credit { margin-top: 12px; }
  @media (max-width: 380px) { .tile { min-height: 84px; padding: 10px 12px; } .tile .tt { margin-top: 8px; } .dash-btn { padding: 10px 12px; } .sec-label { margin-top: 10px; } }
  /* ---------- 2026-10-01 퀵메뉴 톤 맞춤: 대시보드와 같은 계열 · 한 단계 아래 ---------- */
  .tile {
    background: linear-gradient(160deg, #142450 0%, #0f1c40 100%);
    border: 1px solid rgba(224,176,96,.16);
    box-shadow: 0 8px 18px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .tile:active { background: linear-gradient(160deg, #182b5e 0%, #12224a 100%); border-color: rgba(224,176,96,.4); }
  .tile .ti { background: rgba(224,176,96,.14); box-shadow: inset 0 0 0 1px rgba(224,176,96,.45); }
  .tile .ti svg { stroke: #f1cf8a; }
  .tile .td { color: rgba(214,226,255,.55); }
  .tile .chev { stroke: rgba(224,176,96,.55); }
  .today-strip { background: linear-gradient(160deg, #142450 0%, #0f1c40 100%); border-color: rgba(224,176,96,.16); }
</style>
</head>
<body>

  <div class="hero">
    <img src="images/hero.jpg" alt="DURING 사옥 전경">
  </div>

  <div class="hero-text">
    <div class="hero-team">품질경영팀 PORTAL</div>
</div>
  </div>

  <div class="content">
    <div class="today-strip" id="todayStrip"></div>
    <div class="menu">
      <a class="dash-btn" href="m_dashboard.html">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1a1206" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
            <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
            <rect x="3" y="16" width="7" height="5" rx="1.5"></rect>
          </svg>
        </div>
        <div class="text">
          <div class="live"><i></i>LIVE</div>
          <div class="label">실시간 대시보드 접속</div>
          <div class="desc">수입검사 · 정밀측정 현황 한눈에</div>
        </div>
        <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></div>
      </a>
    </div>


    <div class="sec-label">QUICK MENU</div>
    <div class="grid">
      <a class="tile" id="tbTile" href="toolbox.html" onclick="tbSeen()">
        <div class="ti"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        <span class="new-dot">NEW</span>
        <div><div class="tt">현장 툴박스</div><div class="td">판정 · 일정 · 5Why · CMM</div></div>
      </a>
      <a class="tile" href="calc.html">
        <div class="ti"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="11" x2="8" y2="11"/><line x1="12" y1="11" x2="12" y2="11"/><line x1="16" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="8" y2="15"/><line x1="12" y1="15" x2="12" y2="15"/><line x1="16" y1="15" x2="16" y2="15"/><line x1="8" y1="18.5" x2="16" y2="18.5"/></svg></div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        <div><div class="tt">계산기</div><div class="td">환산 · GD&amp;T · Cpk · AQL</div></div>
      </a>
      <a class="tile" href="gauge.html">
        <div class="ti"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8Z"/><path d="M14 2v6h6"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg></div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        <div><div class="tt">계측기 리스트</div><div class="td">교정 현황 · 위치 찾기</div></div>
      </a>
      <a class="tile" href="mark.html" aria-label="현장 마킹">
        <div class="ti"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        <div><div class="tt">현장 마킹</div><div class="td">사진 찍고 바로 표시</div></div>
      </a>
    </div>

    <div class="credit">
      <div class="line"></div>
      <p>Developed by 품질경영팀 정충용<br><a href="mailto:cyjeong@e-during.co.kr">cyjeong@e-during.co.kr</a></p>
    </div>
  </div>

<script>
  // 툴박스 한 번 들어가면 NEW 표시 사라짐 (이 폰 기준)
  function tbSeen() { try { localStorage.setItem('m_tb_seen_v1', '1'); } catch (e) {} }
  (function () { var seen = false; try { seen = localStorage.getItem('m_tb_seen_v1') === '1'; } catch (e) {}
    if (!seen) document.getElementById('tbTile').classList.add('nudge'); })();
  // 오늘 띠: 업무 스케줄러가 남긴 요약(ws_home_cache) + 운동 기록(ws_v1.gym)만 읽음 → 메인 속도 그대로
  (function () {
    var strip = document.getElementById('todayStrip');
    function p2(n) { return (n < 10 ? '0' : '') + n; }
    function render() {
      var d = new Date(), t = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
      var hm = p2(d.getHours()) + ':' + p2(d.getMinutes());
      var cache = null, ws = null;
      try { cache = JSON.parse(localStorage.getItem('ws_home_cache') || 'null'); } catch (e) {}
      try { ws = JSON.parse(localStorage.getItem('ws_v1') || 'null'); } catch (e) {}
      if (!cache && !ws) { strip.className = 'today-strip'; return; }   // 스케줄러를 안 쓰면 띠 없음
      var list = (cache && cache.days && cache.days[t]) || [];
      var next = list.filter(function (x) { return x.t && (x.e || x.t) >= hm; })[0] || list.filter(function (x) { return !x.t; })[0];
      var esc = function (v) { return String(v || '').replace(/[<>&"]/g, ''); };
      var html = '<a class="ts-next" href="work.html">'
        + (next ? '<div class="ts-time' + (next.t ? '' : ' allday') + '">' + (next.t || '종일') + '</div>' : '<div class="ts-time none">—</div>')
        + '<div class="ts-txt"><div class="ts-k">' + (next ? 'NEXT' : 'TODAY') + '</div><div class="ts-t">' + (next ? esc(next.title) : '남은 일정 없음') + '</div></div></a>';
      var todo = (cache && cache.todoOpen) || 0;
      var done = !!(ws && ws.gym && ws.gym[t]);
      html += '<div class="ts-side">'
        + '<a class="ts-cell" href="work.html" aria-label="할 일"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>' + (todo ? '할 일 <b>' + todo + '</b>' : '할 일') + '</span></a>'
        + '<button type="button" class="ts-cell' + (done ? ' on' : '') + '" id="stripGym" aria-label="오늘 운동"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg><span>' + (done ? '운동 ✓' : '운동') + '</span></button>'
        + '</div>';
      strip.innerHTML = html; strip.className = 'today-strip on';
      document.getElementById('stripGym').onclick = function () {
        try {
          var s = JSON.parse(localStorage.getItem('ws_v1') || 'null') || { events: [], work: {}, todos: [], settings: {} };
          s.gym = s.gym || {};
          if (s.gym[t]) delete s.gym[t]; else s.gym[t] = 1;
          localStorage.setItem('ws_v1', JSON.stringify(s));
        } catch (e) {}
        render();
      };
    }
    render();
  })();
</script>
