<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>품질경영팀 PORTAL</title>
<meta name="theme-color" content="#0b1636">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="품질경영팀">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html, body { height: 100%; background: #060b1c; color: #fff; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    background: #060b1c;
    overflow-x: hidden;
  }

  /* ---------- 히어로 (사진 + 텍스트 오버레이) ---------- */
  .hero {
    position: relative; width: 100%; height: 32vh; min-height: 210px; max-height: 300px;
    padding-top: env(safe-area-inset-top);
  }
  .hero img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    object-position: center 38%;
    filter: saturate(1.05);
  }
  .hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(6,11,28,.1) 0%, rgba(6,11,28,.05) 40%, #060b1c 100%);
  }
  .status-pill {
    position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: 16px; z-index: 2;
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(6,11,28,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
    padding: 7px 12px; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,.85);
  }
  .status-pill i { width: 6px; height: 6px; border-radius: 50%; background: #10b981; box-shadow: 0 0 6px rgba(16,185,129,.7); }

  .hero-text { text-align: center; padding: 20px 20px 0; }
  .hero-sub { font-size: 11px; font-weight: 700; letter-spacing: 3px; color: #e0b060; }
  .hero-team { margin-top: 8px; font-size: 20px; font-weight: 900; color: #fff; letter-spacing: .3px; }

  /* ---------- 본문 ---------- */
  .content { flex: 1; display: flex; flex-direction: column; padding: 20px 20px calc(env(safe-area-inset-bottom) + 20px); }

  .menu { width: 100%; max-width: 440px; margin: 0 auto; }

  .dash-btn {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 14px;
    padding: 20px 20px 20px 18px; border-radius: 20px; text-decoration: none;
    background: linear-gradient(160deg, #1b2a54 0%, #12203f 60%, #0c1730 100%);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 16px 36px rgba(0,0,0,.5);
    transition: transform .15s ease;
  }
  .dash-btn:active { transform: scale(.98); }
  .dash-btn .icon {
    flex: none; width: 46px; height: 46px; border-radius: 13px;
    background: linear-gradient(135deg, rgba(224,176,96,.22), rgba(224,176,96,.06));
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(224,176,96,.3);
  }
  .dash-btn .icon svg { width: 24px; height: 24px; }
  .dash-btn .text { flex: 1; min-width: 0; }
  .dash-btn .label { font-size: 17px; font-weight: 900; color: #fff; letter-spacing: .1px; }
  .dash-btn .desc { margin-top: 3px; font-size: 11.5px; font-weight: 600; color: rgba(255,255,255,.45); }
  .dash-btn .arrow {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #ff7a2f, #ff5500);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px;
    box-shadow: 0 8px 18px rgba(255,85,0,.4);
  }
  .dash-btn .watermark {
    position: absolute; bottom: 6px; right: 14px;
    font-size: 8px; font-weight: 800; letter-spacing: 1.5px; color: rgba(255,255,255,.12);
  }

  /* ---------- 가치 4개 (카드 안에 통합, 버튼 아님) ---------- */
  .values {
    display: grid; grid-template-columns: repeat(4, 1fr);
    margin: 14px auto 0; width: 100%; max-width: 440px;
    background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07);
    border-radius: 18px; padding: 16px 4px;
  }
  .value-item { text-align: center; position: relative; padding: 0 2px; }
  .value-item + .value-item::before {
    content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 1px;
    background: rgba(255,255,255,.08);
  }
  .value-item .vi { width: 30px; height: 30px; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; }
  .value-item .vi svg { width: 18px; height: 18px; stroke: #e0b060; opacity: .85; }
  .value-item .vt { font-size: 12px; font-weight: 800; color: #fff; }
  .value-item .vd { margin-top: 3px; font-size: 9px; font-weight: 600; color: rgba(255,255,255,.35); line-height: 1.4; }

  .credit { margin-top: auto; padding-top: 26px; text-align: center; }
  .credit .line { width: 34px; height: 1px; background: rgba(255,255,255,.14); margin: 0 auto 12px; }
  .credit p { font-size: 10.5px; color: rgba(255,255,255,.3); font-weight: 600; line-height: 1.7; letter-spacing: .2px; }
  .credit a { color: rgba(255,255,255,.35); text-decoration: none; }
</style>
</head>
<body>

  <div class="hero">
    <img src="images/hero.jpg" alt="DURING 사옥 전경">
    <div class="status-pill"><i></i>SYSTEM ONLINE</div>
  </div>

  <div class="hero-text">
    <div class="hero-sub">SMART QUALITY PLATFORM</div>
    <div class="hero-team">품질경영팀 PORTAL</div>
  </div>

  <div class="content">
    <div class="menu">
      <a class="dash-btn" href="m_dashboard.html">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#e0b060" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
            <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
            <rect x="3" y="16" width="7" height="5" rx="1.5"></rect>
          </svg>
        </div>
        <div class="text">
          <div class="label">실시간 대시보드 접속</div>
          <div class="desc">수입검사 · 정밀측정 현황 한눈에</div>
        </div>
        <div class="arrow">→</div>
        <div class="watermark">REAL-TIME<br>DASHBOARD</div>
      </a>
    </div>

    <div class="values">
      <div class="value-item">
        <div class="vi"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L20 6 V12 C20 17 16.5 20.5 12 22 C7.5 20.5 4 17 4 12 V6 Z"></path></svg></div>
        <div class="vt">신뢰</div>
        <div class="vd">철저한 데이터</div>
      </div>
      <div class="value-item">
        <div class="vi"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"></path><circle cx="12" cy="12" r="9"></circle></svg></div>
        <div class="vt">품질</div>
        <div class="vd">지속적인 개선</div>
      </div>
      <div class="value-item">
        <div class="vi"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 L4 14 h6 l-1 8 9-12 h-6 Z"></path></svg></div>
        <div class="vt">효율</div>
        <div class="vd">스마트한 운영</div>
      </div>
      <div class="value-item">
        <div class="vi"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="3"></circle><circle cx="16" cy="9" r="3"></circle><path d="M2 20c0-3 2.5-5 6-5s6 2 6 5"></path><path d="M10 20c0-3 2.5-5 6-5s6 2 6 5"></path></svg></div>
        <div class="vt">함께</div>
        <div class="vd">더 나은 발전</div>
      </div>
    </div>

    <div class="credit">
      <div class="line"></div>
      <p>Developed by 품질경영팀 정충용<br><a href="mailto:cyjeong@e-during.co.kr">cyjeong@e-during.co.kr</a></p>
    </div>
  </div>

</body>
</html>
