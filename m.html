<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>품질경영팀 PORTAL</title>
<meta name="theme-color" content="#0b1636">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="품질경영팀">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html, body { height: 100%; background: #060b1c; color: #fff; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    background: #060b1c;
    overflow-x: hidden;
  }

  /* ---------- 히어로 (풀블리드 이미지) ---------- */
  .hero {
    position: relative; width: 100%; height: 28vh; min-height: 190px; max-height: 260px;
    padding-top: env(safe-area-inset-top);
  }
  .hero img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    object-position: center 42%;
    filter: saturate(1.05);
  }
  .hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(6,11,28,.15) 0%, rgba(6,11,28,.05) 40%, #060b1c 100%);
  }
  .status-pill {
    position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: 16px; z-index: 2;
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(6,11,28,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
    padding: 7px 12px; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,.85);
  }
  .status-pill i { width: 6px; height: 6px; border-radius: 50%; background: #10b981; box-shadow: 0 0 6px rgba(16,185,129,.7); }

  /* ---------- 본문 ---------- */
  .content {
    flex: 1; display: flex; flex-direction: column;
    position: relative; z-index: 1;
    padding: 30px 20px calc(env(safe-area-inset-bottom) + 18px);
  }

  .brand { text-align: center; }
  .brand-main { font-size: 24px; font-weight: 900; letter-spacing: 2.5px; background: linear-gradient(90deg, #fff 0%, #fff 55%, #e0b060 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .brand-sub { margin-top: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: 3px; color: #d1a250; }
  .brand-team { margin-top: 12px; font-size: 16px; font-weight: 700; color: rgba(255,255,255,.7); letter-spacing: .5px; }

  .menu { width: 100%; max-width: 440px; margin: 32px auto 0; }

  .dash-btn {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 16px;
    padding: 22px 20px; border-radius: 20px; text-decoration: none;
    background: #ffffff; color: #111;
    box-shadow: 0 14px 32px rgba(0,0,0,.4);
    transition: transform .15s ease;
  }
  .dash-btn:active { transform: scale(.98); }
  .dash-btn .icon {
    flex: none; width: 46px; height: 46px; border-radius: 13px;
    background: linear-gradient(135deg, #fff2df, #f7e2ba);
    display: flex; align-items: center; justify-content: center;
  }
  .dash-btn .icon svg { width: 24px; height: 24px; }
  .dash-btn .text { flex: 1; min-width: 0; }
  .dash-btn .en { font-size: 10px; font-weight: 800; letter-spacing: 1.4px; color: #a87c3f; }
  .dash-btn .label { margin-top: 2px; font-size: 17px; font-weight: 900; color: #111; letter-spacing: .1px; }
  .dash-btn .desc { margin-top: 2px; font-size: 11.5px; font-weight: 600; color: #8a8a8a; }
  .dash-btn .arrow {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    background: #ff5500; color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px;
  }

  /* 하단 작성자 정보 */
  .credit {
    margin-top: auto; padding-top: 30px; text-align: center;
  }
  .credit .line { width: 34px; height: 1px; background: rgba(255,255,255,.14); margin: 0 auto 14px; }
  .credit p { font-size: 11px; color: rgba(255,255,255,.35); font-weight: 600; line-height: 1.7; letter-spacing: .2px; }
  .credit a { color: rgba(255,255,255,.4); text-decoration: none; }
</style>
</head>
<body>

  <div class="hero">
    <img src="images/hero.jpg" alt="DURING 사옥 전경">
    <div class="status-pill"><i></i>SYSTEM ONLINE</div>
  </div>

  <div class="content">
    <div class="brand">
      <div class="brand-main">DURING</div>
      <div class="brand-sub">SMART QUALITY PLATFORM</div>
      <div class="brand-team">품질경영팀 PORTAL</div>
    </div>

    <div class="menu">
      <a class="dash-btn" href="m_dashboard.html">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#c8952e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
            <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
            <rect x="3" y="16" width="7" height="5" rx="1.5"></rect>
          </svg>
        </div>
        <div class="text">
          <div class="en">REALTIME DASHBOARD</div>
          <div class="label">실시간 대시보드 접속</div>
          <div class="desc">수입검사 · 정밀측정 현황</div>
        </div>
        <div class="arrow">→</div>
      </a>
    </div>

    <div class="credit">
      <div class="line"></div>
      <p>Developed by 품질경영팀 정충용<br><a href="mailto:cyjeong@e-during.co.kr">cyjeong@e-during.co.kr</a></p>
    </div>
  </div>

</body>
</html>
