<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<script src="js/gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>현장 마킹</title>
<meta name="theme-color" content="#0b1636">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html { height: 100%; background: #060b1c; }
  body {
    min-height: 100%; min-height: 100dvh;
    background: #060b1c; color: #fff;
    display: flex; flex-direction: column;
    overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }

  header {
    position: relative;
    padding: calc(env(safe-area-inset-top) + 14px) 18px 12px;
    display: flex; align-items: center;
    background: linear-gradient(180deg, #0d1836 0%, #0b1636 100%);
    border-bottom: 1px solid rgba(255,255,255,.06);
    flex-shrink: 0;
  }
  header .back { position: absolute; left: 18px; top: calc(env(safe-area-inset-top) + 14px); width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; text-decoration: none; color: #fff; font-size: 15px; z-index: 1; }
  header .title { flex: 1; text-align: center; }
  header .title .t1 { font-size: 15.5px; font-weight: 900; color: #fff; }
  header .title .t2 { margin-top: 1px; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #e0b060; }

  main { flex: 1; padding: 16px 16px calc(env(safe-area-inset-bottom) + 24px); max-width: 480px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  /* ---------- 시작 화면 ---------- */
  #startScreen { display: flex; flex-direction: column; gap: 12px; margin-top: 8vh; }
  .start-hint { text-align: center; font-size: 12.5px; color: rgba(255,255,255,.4); font-weight: 600; margin-bottom: 6px; line-height: 1.6; }
  .pick-btn {
    display: flex; align-items: center; gap: 14px; padding: 18px 16px; border-radius: 18px;
    background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.08);
    text-decoration: none; color: #fff; cursor: pointer;
  }
  .pick-btn:active { background: rgba(255,255,255,.07); }
  .pick-btn .pi { flex: none; width: 46px; height: 46px; border-radius: 13px; background: rgba(224,176,96,.12); border: 1px solid rgba(224,176,96,.35); display: flex; align-items: center; justify-content: center; }
  .pick-btn .pi svg { width: 22px; height: 22px; stroke: #e0b060; }
  .pick-btn .pt { font-size: 14.5px; font-weight: 800; }
  .pick-btn .pd { margin-top: 2px; font-size: 11px; color: rgba(255,255,255,.4); font-weight: 600; }
  .pick-btn.primary { border-color: rgba(224,176,96,.4); background: rgba(224,176,96,.08); }

  /* ---------- 마킹 화면 ---------- */
  #markScreen { display: none; flex-direction: column; gap: 12px; }
  .tool-seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .tool-seg button {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 2px; border-radius: 11px; border: 1px solid rgba(255,255,255,.12);
    background: #0c1730; color: rgba(255,255,255,.5); font-size: 9.5px; font-weight: 800; font-family: inherit;
  }
  .tool-seg button svg { width: 16px; height: 16px; }
  .tool-seg button.on { background: rgba(224,176,96,.16); border-color: #e0b060; color: #e0b060; }
  .color-strip { display: flex; align-items: center; gap: 9px; padding: 2px 3px; }
  .color-strip .clabel { font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,.4); margin-right: 2px; }
  .color-strip .cswatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.15); padding: 0; }
  .color-strip .cswatch.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(224,176,96,.65); }
  /* 도구별 옵션 바 (한 줄) */
  .optbar { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 8px; border-radius: 12px; background: #0c1730; border: 1px solid rgba(255,255,255,.1); overflow: hidden; }
  .ob-div { flex: none; width: 1px; height: 24px; background: rgba(255,255,255,.14); }
  .ob-j { display: flex; gap: 6px; }
  .ob-j button { height: 34px; padding: 0 12px; border-radius: 9px; border: 1.5px solid rgba(255,255,255,.16); background: transparent; color: rgba(255,255,255,.55); font-size: 13.5px; font-weight: 900; font-family: inherit; white-space: nowrap; }
  .ob-j button.ok.on { background: #16a34a; border-color: #16a34a; color: #fff; box-shadow: 0 3px 10px -3px rgba(22,163,74,.7); }
  .ob-j button.ng.on { background: #dc2626; border-color: #dc2626; color: #fff; box-shadow: 0 3px 10px -3px rgba(220,38,38,.7); }
  .ob-col { display: flex; gap: 7px; }
  .ob-col .sw, .szrow .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); padding: 0; flex: none; }
  .ob-col .sw.on, .szrow .sw.on { border-color: #fff; box-shadow: 0 0 0 2px #e0b060; }
  .ob-sz { display: flex; gap: 4px; }
  .ob-sz button { width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid rgba(255,255,255,.14); background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; color: rgba(255,255,255,.6); font-family: inherit; }
  .ob-sz button.on { border-color: #e0b060; background: rgba(224,176,96,.16); color: #e0b060; }
  .ic-dot { display: block; border-radius: 50%; background: currentColor; }
  .ic-line { display: block; width: 20px; border-radius: 4px; background: currentColor; transform: rotate(-35deg); }
  .ic-ga { font-weight: 900; line-height: 1; }
  .ob-hint { font-size: 12.5px; font-weight: 800; color: rgba(255,255,255,.72); white-space: nowrap; }
  .ob-bg { flex: none; height: 34px; padding: 0 10px; border-radius: 9px; border: 1.5px solid rgba(255,255,255,.16); background: transparent; color: rgba(255,255,255,.55); font-size: 12.5px; font-weight: 900; font-family: inherit; margin-left: auto; }
  .ob-bg.on { background: #fff; border-color: #fff; color: #0b1636; }
  .tool-hint { margin-top: -6px; font-size: 11.5px; font-weight: 700; color: rgba(224,176,96,.85); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .szrow { display: flex; align-items: center; gap: 8px; }
  .szrow .ob-sz button { width: 44px; height: 40px; }
  .canvas-wrap { border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,.1); background: #0c1730; line-height: 0; }
  #markCanvas { width: 100%; display: block; touch-action: none; }

  .toolbar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .toolbar button {
    padding: 11px 4px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12);
    background: #0c1730; color: rgba(255,255,255,.7); font-size: 11.5px; font-weight: 800; font-family: inherit;
  }
  .toolbar button:active { background: #16233f; }

  .legend { display: flex; flex-direction: column; gap: 6px; }
  .legend-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07); }
  .legend-item .lnum { flex: none; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; }
  .legend-item .lnum.ok { background: #16a34a; }
  .legend-item .lnum.ng { background: #dc2626; }
  .legend-item .ltxt { flex: 1; min-width: 0; }
  .legend-item .lv { font-size: 12px; font-weight: 800; }
  .legend-item .lv.ok { color: #34d399; }
  .legend-item .lv.ng { color: #fb7185; }
  .legend-item .lm { margin-top: 1px; font-size: 11px; color: rgba(255,255,255,.45); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-empty { text-align: center; font-size: 11.5px; color: rgba(255,255,255,.3); padding: 10px; }

  .btn-primary {
    width: 100%; padding: 15px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, #ff7a2f, #ff5500); color: #fff;
    font-size: 15px; font-weight: 800; font-family: inherit;
    box-shadow: 0 10px 24px rgba(255,85,0,.35);
  }
  .btn-primary:active { transform: scale(.98); }
  .hint { font-size: 10.5px; color: rgba(255,255,255,.35); line-height: 1.6; text-align: center; }

  /* ---------- 포인트 입력 시트 ---------- */
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 49; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 480px; margin: 0 auto;
    background: #0b1636; border: 1px solid rgba(255,255,255,.1); border-bottom: none;
    border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.45);
    padding: 18px 16px calc(env(safe-area-inset-bottom) + 16px);
    transform: translateY(100%); transition: transform .22s ease;
  }
  .sheet.show { transform: translateY(0); }
  .sheet .sh-title { font-size: 13px; font-weight: 800; color: #e0b060; margin-bottom: 14px; }
  .sheet .seg-okng { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .sheet .seg-okng button {
    padding: 16px 0; border-radius: 14px; border: 1px solid rgba(255,255,255,.12);
    background: #0c1730; color: rgba(255,255,255,.6); font-size: 15px; font-weight: 900; font-family: inherit;
  }
  .sheet .seg-okng button.ok.on { background: rgba(52,211,153,.16); border-color: #34d399; color: #34d399; }
  .sheet .seg-okng button.ng.on { background: rgba(251,113,133,.16); border-color: #fb7185; color: #fb7185; }
  .sheet .seg-okng.hidden { display: none; }
  .sheet .memo-field { margin-bottom: 16px; }
  .sheet .memo-field label { display: block; font-size: 11px; font-weight: 700; color: rgba(255,255,255,.5); margin-bottom: 6px; }
  .sheet .memo-field input {
    width: 100%; background: #0c1730; border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
    padding: 12px 13px; font-size: 14px; font-weight: 600; color: #fff; font-family: inherit;
  }
  .sheet .memo-field input:focus { outline: none; border-color: #e0b060; }
  .sheet .sheet-field { margin-bottom: 16px; }
  .sheet .sheet-field label { display: block; font-size: 11px; font-weight: 700; color: rgba(255,255,255,.5); margin-bottom: 8px; }
  .sheet .sheet-field.hidden { display: none; }
  .sheet input[type="range"] { width: 100%; height: 4px; accent-color: #e0b060; }
  .sheet .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sheet .sheet-actions.has-del { grid-template-columns: auto 1fr 1fr; }
  .sheet .sheet-actions button { padding: 13px 10px; border-radius: 12px; border: none; font-size: 13.5px; font-weight: 800; font-family: inherit; }
  .sheet .btn-cancel { background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); }
  .sheet .btn-del { background: #dc2626; color: #fff; padding-left: 14px !important; padding-right: 14px !important; }
  .sheet .btn-confirm { background: linear-gradient(135deg, #ff7a2f, #ff5500); color: #fff; }

  /* 포인트 입력창 (측정값 중심) */
  .ptsheet { padding: 14px 14px calc(env(safe-area-inset-bottom) + 12px); }
  .pt-head { display: flex; align-items: center; gap: 10px; }
  .pt-no { flex: none; min-width: 52px; font-size: 22px; font-weight: 900; color: #e0b060; line-height: 1; white-space: nowrap; }
  .pt-no small { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.4); margin-left: 2px; }
  .pt-seg { flex: 1; display: grid; grid-template-columns: 1fr 1fr; padding: 3px; gap: 3px; border-radius: 12px; background: #0c1730; border: 1px solid rgba(255,255,255,.12); }
  .pt-seg button { height: 36px; border: none; border-radius: 9px; background: transparent; color: rgba(255,255,255,.45); font-size: 14px; font-weight: 900; font-family: inherit; }
  .pt-seg button.ok.on { background: #16a34a; color: #fff; box-shadow: 0 3px 10px -4px rgba(22,163,74,.8); }
  .pt-seg button.ng.on { background: #dc2626; color: #fff; box-shadow: 0 3px 10px -4px rgba(220,38,38,.8); }
  .pt-del { flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(251,113,133,.45); background: rgba(220,38,38,.16); font-size: 17px; }
  .pt-vals { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .pt-vals input { width: calc((100% - 58px) / 3); height: 50px; background: #0c1730; border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 0 6px; font-size: 18px; font-weight: 900; color: #fff; font-family: inherit; text-align: center; font-variant-numeric: tabular-nums; }
  .pt-vals input::placeholder { font-size: 13px; font-weight: 700; color: rgba(255,255,255,.3); }
  .pt-vals input:focus, #ptMemo:focus { outline: none; border-color: #e0b060; box-shadow: 0 0 0 2px rgba(224,176,96,.25); }
  .pt-vals button { flex: none; width: 40px; height: 50px; border-radius: 12px; border: 1px dashed rgba(255,255,255,.3); background: none; color: rgba(255,255,255,.7); font-size: 20px; font-weight: 800; }
  #ptMemo { display: block; width: 100%; height: 48px; margin-top: 8px; background: #0c1730; border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 0 14px; font-size: 15px; font-weight: 700; color: #fff; font-family: inherit; }
  #ptMemo::placeholder { color: rgba(255,255,255,.3); font-weight: 700; }
  .pt-nav { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 12px; }
  .pt-nav button { height: 50px; border-radius: 12px; border: none; font-size: 15px; font-weight: 900; font-family: inherit; background: rgba(255,255,255,.08); color: rgba(255,255,255,.85); }
  .pt-nav button:disabled { opacity: .3; }
  .pt-nav button.pri { background: linear-gradient(135deg, #ff7a2f, #ff5500); color: #fff; }
  /* 측정값 입력 · 간이 성적서 */
  .vals { display: flex; flex-wrap: wrap; gap: 6px; }
  .vals input { width: 84px; height: 44px; background: #0c1730; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 10px 8px; font-size: 15px; font-weight: 800; color: #fff; font-family: inherit; text-align: center; }
  .vals input:focus { outline: none; border-color: #e0b060; }
  .vals button { width: 44px; border-radius: 10px; border: 1px dashed rgba(255,255,255,.3); background: none; color: rgba(255,255,255,.7); font-size: 18px; font-weight: 800; }
  .legend-item .lvals { flex: none; font-size: 12px; font-weight: 800; color: #e0b060; font-variant-numeric: tabular-nums; max-width: 42%; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-report { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid #e0b060; background: rgba(224,176,96,.12); color: #e0b060; font-size: 14.5px; font-weight: 900; font-family: inherit; display: none; }
  .pno { display: none; gap: 8px; align-items: center; }
  .pno label { flex: none; font-size: 11.5px; font-weight: 700; color: rgba(255,255,255,.5); }
  .pno input { flex: 1; min-width: 0; background: #0c1730; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 700; color: #fff; font-family: inherit; }
  .rp-wrap { position: fixed; inset: 0; z-index: 70; background: rgba(5,10,24,.92); display: none; flex-direction: column; padding: calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px); }
  .rp-wrap.show { display: flex; }
  .rp-img { flex: 1; min-height: 0; overflow: auto; border-radius: 12px; background: #fff; }
  .rp-img img { width: 100%; display: block; }
  .rp-btns { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .rp-btns button { padding: 13px 4px; border-radius: 12px; border: none; font-size: 13.5px; font-weight: 800; font-family: inherit; background: rgba(255,255,255,.1); color: #fff; }
  .rp-btns button.pri { background: #e0b060; color: #1a1206; }
  .rp-close { margin-top: 8px; padding: 11px; border-radius: 12px; border: none; background: none; color: rgba(255,255,255,.6); font-size: 13px; font-weight: 800; font-family: inherit; }
  /* ===== 2026-09-30 디자인 다듬기 (공간 절약 · 한 단계 업그레이드) ===== */
  header { padding-right: 18px; }
  .hsave { position: absolute; right: 14px; top: calc(env(safe-area-inset-top) + 11px); display: none; align-items: center; gap: 5px; height: 34px; padding: 0 13px 0 11px; border-radius: 999px; border: none; background: linear-gradient(135deg, #ff7a2f, #ff5500); color: #fff; font-size: 13px; font-weight: 900; font-family: inherit; box-shadow: 0 6px 16px -6px rgba(255,85,0,.7); z-index: 2; }
  .hsave svg { width: 15px; height: 15px; }
  .hsave.show { display: flex; }
  .hsave:active { transform: scale(.95); }
  /* [2026-09-30] 헤더: 📸 캡처 + ✓ 측정완료 */
  .hbtns { position: absolute; right: 12px; top: calc(env(safe-area-inset-top) + 11px); display: none; gap: 6px; z-index: 2; }
  .hbtns.show { display: flex; }
  .hbtns button { display: flex; align-items: center; gap: 4px; height: 34px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 900; font-family: inherit; white-space: nowrap; }
  .hbtns button:active { transform: scale(.95); }
  .hbtns svg { width: 14px; height: 14px; }
  .hcap { border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: #fff; }
  .hdone { border: none; background: linear-gradient(135deg, #ff7a2f, #ff5500); color: #fff; box-shadow: 0 6px 16px -6px rgba(255,85,0,.7); }
  body.marking header .title { text-align: left; padding-left: 44px; padding-top: 5px; }
  body.marking header .title .t2 { display: none; }
  /* 측정완료 → 성적서 카드 강조 */
  .rp-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rp-top span { font-size: 11.5px; font-weight: 800; color: rgba(255,255,255,.65); }
  .rp-top button { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.18); background: none; color: rgba(255,255,255,.8); font-size: 11.5px; font-weight: 800; font-family: inherit; }
  .rp-card.flash { animation: rpFlash 1.1s ease-in-out 3; }
  .rp-card.flash .btn-report { animation: rpBtn 1.1s ease-in-out 3; }
  .rp-card.flash .pno input { border-color: #e0b060; box-shadow: 0 0 0 3px rgba(224,176,96,.3); }
  @keyframes rpFlash { 0%,100% { box-shadow: 0 0 0 0 rgba(224,176,96,0); } 50% { box-shadow: 0 0 0 4px rgba(224,176,96,.55), 0 0 24px rgba(224,176,96,.45); } }
  @keyframes rpBtn { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); filter: brightness(1.12); } }
  /* 항목 | 메모 한 줄 */
  .pt-row2 { display: grid; grid-template-columns: 2fr 3fr; gap: 8px; margin-top: 12px; }
  .pt-row2 input { width: 100%; min-width: 0; height: 46px; background: #0c1730; border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 0 12px; font-size: 15px; font-weight: 700; color: #fff; font-family: inherit; }
  .pt-row2 input::placeholder { color: rgba(255,255,255,.3); font-weight: 700; }
  .pt-row2 input:focus { outline: none; border-color: #e0b060; box-shadow: 0 0 0 2px rgba(224,176,96,.25); }
  .pt-row2 #ptMemo { margin-top: 0; height: 46px; }
  main { padding-top: 12px; }
  #markScreen { gap: 10px; }
  .tool-seg { gap: 3px; padding: 3px; border-radius: 14px; background: #0c1730; border: 1px solid rgba(255,255,255,.08); }
  .tool-seg button { flex-direction: row; justify-content: center; gap: 4px; height: 36px; padding: 0 2px; border: none; border-radius: 11px; background: transparent; color: rgba(255,255,255,.5); font-size: 11.5px; white-space: nowrap; }
  .tool-seg button svg { width: 14px; height: 14px; flex: none; }
  .tool-seg button.on { background: linear-gradient(180deg, rgba(224,176,96,.24), rgba(224,176,96,.12)); color: #f0c77a; box-shadow: inset 0 0 0 1px rgba(224,176,96,.55); }
  .optbar { height: 38px; padding: 0 6px; gap: 7px; border-radius: 12px; background: rgba(12,23,48,.7); border-color: rgba(255,255,255,.07); }
  .ob-j { gap: 4px; }
  .ob-j button { height: 28px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; border-width: 1px; }
  .ob-col { gap: 6px; }
  .ob-col .sw { width: 22px; height: 22px; }
  .ob-col .sw[data-color='#111827'], .szrow .sw[data-color='#111827'] { border-color: rgba(255,255,255,.55); }
  .ob-sz { gap: 3px; }
  .ob-sz button { width: 30px; height: 28px; border-radius: 8px; border-width: 1px; }

<body>

  <main>

    <!-- ============ 시작 화면 ============ -->

        <div>
          <div class="pt">갤러리에서 선택</div>

        </button>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="1.5"></rect></svg>

        <button type="button" onclick="clearMarks()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>전체 지우기</button>
        <button type="button" onclick="resetPhoto()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>새 사진</button>

  <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
  <div class="sheet" id="pointSheet">
    <div class="sh-title" id="sheetTitle">포인트 ① 추가</div>

      <button type="button" class="ok on" id="segOk" onclick="setJudge('ok')">✓ OK</button>

  <!-- 포인트 번호 입력창: 측정값 중심 · 다음 번호로 빠르게 -->
  <div class="sheet ptsheet" id="ptSheet">
    <div class="pt-head">
      <span class="pt-no" id="ptNo"></span>
      <div class="pt-seg"><button type="button" class="ok" id="ptOk" onclick="setPtJudge('ok')">✓ OK</button><button type="button" class="ng" id="ptNg" onclick="setPtJudge('ng')">✕ NG</button></div>

  <div class="toast" id="toast"></div>

<script>
  function id(x){ return document.getElementById(x); }

  const canvas = id('markCanvas');
  const ctx = canvas.getContext('2d');
  let baseImg = null;         // 로드된 원본 Image 객체
  // marks 항목 형태:
  //   포인트: { type:'point', x, y, judge:'ok'|'ng', memo, num, sizeMul }
  //   화살표: { type:'arrow', x1, y1, x2, y2, color }
  //   박스:   { type:'box',   x1, y1, x2, y2, color }
  //   텍스트: { type:'text', x, y, text, w, h, sizeMul }
  let marks = [];
  let nextNum = 1;
  let pendingXY = null;       // 신규 항목 좌표(캔버스 픽셀 기준)
  let editingIndex = -1;      // 수정 중인 인덱스(-1이면 신규)
  let sheetType = 'point';    // 현재 시트가 다루는 타입: 'point' | 'text' | 'arrow' | 'box'
  let currentJudge = 'ok';
  let currentTool = 'point';  // 'point' | 'arrow' | 'box' | 'text' | 'move'
  let currentSizeMul = 1;     // 시트에서 조정 중인 크기 배율(포인트/텍스트)
  // 옵션 바 상태 (새로 찍는/그리는 항목에 적용)
  const DRAW_COLORS = [['#dc2626','빨강'],['#111827','검정'],['#2563eb','파랑'],['#16a34a','초록']];
  const POINT_SIZES = [['S',0.7],['M',1],['L',1.35],['XL',1.75]];
  const LINE_SIZES  = [['S',0.6],['M',1],['L',1.6]];
  const TEXT_SIZES  = [['S',0.75],['M',1],['L',1.4]];
  let barJudge = 'ok', barPointSize = 1, barColor = '#dc2626', barLine = 1, barTextSize = 1, barTextBg = true;
  let sheetSizeKind = 'point';

  // 드래그(화살표/박스 신규 생성) 상태
  let dragging = false;
  let dragStart = null;
  let dragCurrent = null;
  let dragShapeType = null;   // 'arrow' | 'box'
  let downPoint = null;
  let downHitIndex = -1;

  // 이동(조정) 상태
  let movingMark = false;
  let moveIndex = -1;
  let moveOrigin = null;

  const JUDGE_COLOR = { ok: '#16a34a', ng: '#dc2626' };
  const ARROW_COLOR = '#e0b060';
  const TEXT_BG = 'rgba(224,176,96,0.92)';
  const MAX_DIM = 1600; // 저장/작업용 최대 픽셀 크기 (성능·용량 균형)

  const TOOL_HINTS = {
    point: '누르는 대로 ①②③ 찍힘 · 번호를 누르면 메모·측정값',
    arrow: '드래그해서 그리기 · 그린 화살표 누르면 수정/삭제',
    box: '그린 박스를 누르면 색 변경/삭제',
    text: '사진을 누르면 글자 입력 · 쓴 글자 누르면 수정',
    move: '항목을 눌러서 드래그하면 위치 이동'
  };

  function setTool(t){
    currentTool = t;
    ['point','arrow','box','text','move'].forEach(k => id('tool-'+k).classList.toggle('on', k===t));
    id('toolHint').innerText = TOOL_HINTS[t];
    id('toolHint').style.display = t === 'move' ? '' : 'none';
    renderOptBar();
  }

  function sizeIcon(kind, i){
    if (kind === 'point'){ const r = [3,4.5,6,8][i]; return `<span class="ic-dot" style="width:${r*2}px;height:${r*2}px"></span>`; }
    if (kind === 'line'){ const w = [2,3.5,6][i]; return `<span class="ic-line" style="height:${w}px"></span>`; }
    const f = [11,14,18][i]; return `<span class="ic-ga" style="font-size:${f}px">가</span>`;
  }
  function sizeBtns(kind, list, cur, fn){
    return '<div class="ob-sz">' + list.map(([l, v], i) =>
      `<button type="button" class="${v === cur ? 'on' : ''}" onclick="${fn}(${v})" aria-label="크기 ${l}">${sizeIcon(kind, i)}</button>`).join('') + '</div>';
  }
  function colorBtns(cur, fn){
    return '<div class="ob-col">' + DRAW_COLORS.map(([c, n]) =>
      `<button type="button" class="sw${c === cur ? ' on' : ''}" data-color="${c}" style="background:${c}" onclick="${fn}('${c}')" aria-label="${n}"></button>`).join('') + '</div>';
  }
  function renderOptBar(){
    const t = currentTool, D = '<i class="ob-div"></i>';
    let h = '';
    if (t === 'point') h = `<div class="ob-j"><button type="button" class="ok${barJudge==='ok'?' on':''}" onclick="setBarJudge('ok')">✓ OK</button><button type="button" class="ng${barJudge==='ng'?' on':''}" onclick="setBarJudge('ng')">✕ NG</button></div>` + D + sizeBtns('point', POINT_SIZES, barPointSize, 'setBarPointSize');
    else if (t === 'arrow') h = colorBtns(barColor, 'setBarColor') + D + sizeBtns('line', LINE_SIZES, barLine, 'setBarLine');
    else if (t === 'box') h = colorBtns(barColor, 'setBarColor') + D + '<span class="ob-hint">↔ 드래그해서 그리기</span>';
    else if (t === 'text') h = colorBtns(barColor, 'setBarColor') + D + sizeBtns('text', TEXT_SIZES, barTextSize, 'setBarTextSize') + `<button type="button" class="ob-bg${barTextBg?' on':''}" onclick="toggleBarTextBg()">바탕</button>`;
    const b = id('optBar');
    b.innerHTML = h;
    b.style.display = h ? 'flex' : 'none';
  }
  function setBarJudge(j){ barJudge = j; renderOptBar(); }
  function setBarPointSize(v){ barPointSize = v; renderOptBar(); }
  function setBarColor(c){ barColor = c; renderOptBar(); }
  function setBarLine(v){ barLine = v; renderOptBar(); }
  function setBarTextSize(v){ barTextSize = v; renderOptBar(); }
  function toggleBarTextBg(){ barTextBg = !barTextBg; renderOptBar(); showToast(barTextBg ? '글자 뒤에 흰 바탕을 깝니다' : '바탕 없이 글자만 (흰 테두리)'); }

  function addPointQuick(pt){
    marks.push({ type: 'point', x: pt.x, y: pt.y, judge: barJudge, memo: '', vals: [], num: nextNum, sizeMul: barPointSize });
    nextNum++;
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
    redraw();
  }

  // -------- 사진 불러오기 --------
  function loadImage(evt){
    const file = evt.target.files && evt.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      baseImg = img;
      marks = [];
      nextNum = 1;
      setTool('point');
      setupCanvas();
      id('startScreen').style.display = 'none';
      id('markScreen').style.display = 'flex';
      id('hdrSave').classList.add('show'); document.body.classList.add('marking');
      URL.revokeObjectURL(url);
    };
    img.onerror = () => { showToast('이미지를 불러오지 못했습니다'); };
    img.src = url;
    evt.target.value = '';
  }

  function setupCanvas(){
    const ratio = baseImg.naturalWidth / baseImg.naturalHeight;
    let w = baseImg.naturalWidth, h = baseImg.naturalHeight;
    if (w > MAX_DIM || h > MAX_DIM){
      if (w >= h){ w = MAX_DIM; h = Math.round(MAX_DIM / ratio); }
      else { h = MAX_DIM; w = Math.round(MAX_DIM * ratio); }
    }
    canvas.width = w;
    canvas.height = h;
    redraw();
  }

  function markerRadius(sizeMul){ return Math.max(22, canvas.width * 0.03) * (sizeMul || 1); }

  function lineW(mul){ return Math.max(4, canvas.width * 0.006) * (mul || 1); }
  function drawArrowShape(g, x1, y1, x2, y2, color, alpha, mul){
    const lw = lineW(mul);
    const headLen = Math.max(14, canvas.width * 0.02) * Math.pow(mul || 1, 0.75);
    const angle = Math.atan2(y2 - y1, x2 - x1);
    g.save();
    g.globalAlpha = (alpha === undefined) ? 1 : alpha;
    g.strokeStyle = color; g.fillStyle = color;
    g.lineWidth = lw;
    g.lineCap = 'round';
    // 선 끝이 화살촉 밖으로 삐져나오지 않게 조금 짧게
    const ex = x2 - Math.cos(angle) * headLen * 0.6, ey = y2 - Math.sin(angle) * headLen * 0.6;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(ex, ey); g.stroke();
    g.beginPath();
    g.moveTo(x2, y2);
    g.lineTo(x2 - headLen * Math.cos(angle - Math.PI/7), y2 - headLen * Math.sin(angle - Math.PI/7));
    g.lineTo(x2 - headLen * Math.cos(angle + Math.PI/7), y2 - headLen * Math.sin(angle + Math.PI/7));
    g.closePath(); g.fill();
    g.restore();
  }

  function drawBoxShape(g, x1, y1, x2, y2, color, alpha, mul){
    g.save();
    g.globalAlpha = (alpha === undefined) ? 1 : alpha;
    g.strokeStyle = color;
    g.lineWidth = lineW(mul);
    const x = Math.min(x1, x2), y = Math.min(y1, y2), w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
    g.strokeRect(x, y, w, h);
    g.restore();
  }

  function roundRectPath(g, x, y, w, h, r){
    g.beginPath();
    g.moveTo(x+r, y);
    g.arcTo(x+w, y, x+w, y+h, r);
    g.arcTo(x+w, y+h, x, y+h, r);
    g.arcTo(x, y+h, x, y, r);
    g.arcTo(x, y, x+w, y, r);
    g.closePath();
  }

  function drawTextShape(g, m){
    const fontSize = Math.max(20, canvas.width * 0.03) * (m.sizeMul || 1);
    const color = m.color || '#111827';
    const bg = m.bg !== false;
    g.save();
    g.font = `900 ${fontSize}px -apple-system, sans-serif`;
    const metrics = g.measureText(m.text);
    const padX = Math.round(fontSize * 0.35), padY = Math.round(fontSize * 0.22);
    const w = metrics.width + padX*2;
    const h = fontSize + padY*2;
    m.w = w; m.h = h;
    if (bg){
      roundRectPath(g, m.x, m.y - h/2, w, h, Math.round(fontSize * 0.28));
      g.fillStyle = 'rgba(255,255,255,0.92)';
      g.fill();
      g.lineWidth = Math.max(2, fontSize * 0.07);
      g.strokeStyle = color;
      g.stroke();
    }
    g.textAlign = 'left'; g.textBaseline = 'middle';
    if (!bg){
      g.lineJoin = 'round';
      g.lineWidth = Math.max(3, fontSize * 0.2);
      g.strokeStyle = 'rgba(255,255,255,0.95)';
      g.strokeText(m.text, m.x + padX, m.y);
    }
    g.fillStyle = color;
    g.fillText(m.text, m.x + padX, m.y);
    g.restore();
  }

  function drawPointShape(g, m){
    const r = markerRadius(m.sizeMul);
    g.beginPath();
    g.arc(m.x, m.y, r, 0, Math.PI*2);
    g.fillStyle = JUDGE_COLOR[m.judge];
    g.globalAlpha = 0.88;
    g.fill();
    g.globalAlpha = 1;
    g.lineWidth = Math.max(2, r*0.12);
    g.strokeStyle = '#ffffff';
    g.stroke();
    g.fillStyle = '#ffffff';
    g.font = `900 ${Math.round(r*1.05)}px -apple-system, sans-serif`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(String(m.num), m.x, m.y + r*0.06);
    if (ptIndex >= 0 && marks[ptIndex] === m){
      g.beginPath(); g.arc(m.x, m.y, r + Math.max(5, r*0.28), 0, Math.PI*2);
      g.lineWidth = Math.max(4, r*0.2); g.strokeStyle = '#e0b060'; g.stroke();
    }
  }

  function redraw(){
    if(!baseImg) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(baseImg, 0, 0, canvas.width, canvas.height);
    marks.forEach(m => {
      if (m.type === 'arrow') drawArrowShape(ctx, m.x1, m.y1, m.x2, m.y2, m.color || ARROW_COLOR, 1, m.w);
      else if (m.type === 'box') drawBoxShape(ctx, m.x1, m.y1, m.x2, m.y2, m.color || ARROW_COLOR, 1, m.w);
      else if (m.type === 'text') drawTextShape(ctx, m);
      else drawPointShape(ctx, m);
    });
    if (dragging && dragStart && dragCurrent){
      if (dragShapeType === 'box') drawBoxShape(ctx, dragStart.x, dragStart.y, dragCurrent.x, dragCurrent.y, barColor, 0.55, 1);
      else drawArrowShape(ctx, dragStart.x, dragStart.y, dragCurrent.x, dragCurrent.y, barColor, 0.55, barLine);
    }
    renderLegend();
  }

  function renderLegend(){
    const wrap = id('legendList');
    const points = marks.map((m, i) => ({ m, i })).filter(o => o.m.type === 'point');
    if (points.length === 0){
      wrap.innerHTML = '<div class="legend-empty">아직 표시된 포인트가 없습니다</div>';
      syncReportBtn();
      return;
    }
    wrap.innerHTML = points.map(({ m, i }) => `
      <div class="legend-item" onclick="openEditSheetByIndex(${i})">
        <div class="lnum ${m.judge}">${m.num}</div>
        <div class="ltxt">
          <div class="lv ${m.judge}">${m.judge === 'ok' ? 'OK' : 'NG'}</div>
          <div class="lm">${[m.item, m.memo].filter(Boolean).map(escH).join(' · ') || '항목·메모 없음'}</div>
        </div>
        ${m.vals && m.vals.length ? `<div class="lvals">${m.vals.map(x => x ? escH(x) : '–').join(' · ')}</div>` : ''}
      </div>
    `).join('');
    syncReportBtn();
  }

  function escH(t){ return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function hasVals(){ return marks.some(m => m.type === 'point' && m.vals && m.vals.length); }
  function measureDone(){
    const pts = marks.filter(m => m.type === 'point');
    if (!pts.length) { showToast('사진을 눌러 번호를 먼저 찍어주세요'); return; }
    if (!hasVals()) { showToast('번호를 눌러 측정값을 먼저 입력하세요'); return; }
    const card = id('rpCard');
    card.classList.remove('flash'); void card.offsetWidth;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 3500);
  }
  function syncReportBtn(){ const on = hasVals(); id('reportBtn').style.display = on ? 'flex' : 'none'; id('pnoRow').style.display = on ? 'flex' : 'none'; id('rpCard').style.display = on ? 'flex' : 'none';
    if (on) { const pts = marks.filter(m => m.type === 'point'); id('rpSummary').textContent = `측정 기록 · 번호 ${pts.length}개 · 값 입력 ${pts.filter(m => m.vals && m.vals.some(Boolean)).length}개`; } }

  // -------- 좌표/히트테스트 --------
  function getCanvasPoint(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }

  function distToSegment(p, a, b){
    const dx = b.x - a.x, dy = b.y - a.y;
    const lenSq = dx*dx + dy*dy;
    if (lenSq === 0) return Math.hypot(p.x - a.x, p.y - a.y);
    let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const px = a.x + t * dx, py = a.y + t * dy;
    return Math.hypot(p.x - px, p.y - py);
  }

  function hitTest(pt){
    for (let i = marks.length - 1; i >= 0; i--){
      const m = marks[i];
      if (m.type === 'point'){
        const r = markerRadius(m.sizeMul);
        if (Math.hypot(m.x - pt.x, m.y - pt.y) <= r + 10) return i;
      } else if (m.type === 'arrow'){
        if (distToSegment(pt, {x:m.x1,y:m.y1}, {x:m.x2,y:m.y2}) <= Math.max(16, lineW(m.w) * 1.5)) return i;
      } else if (m.type === 'box'){
        const x = Math.min(m.x1,m.x2), y = Math.min(m.y1,m.y2), w = Math.abs(m.x2-m.x1), h = Math.abs(m.y2-m.y1);
        const c = [{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h}];
        const edges = [[c[0],c[1]],[c[1],c[2]],[c[2],c[3]],[c[3],c[0]]];
        for (const [a,b] of edges){ if (distToSegment(pt, a, b) <= 16) return i; }
      } else if (m.type === 'text'){
        const w = m.w || 60, h = m.h || 30;
        if (pt.x >= m.x - 8 && pt.x <= m.x + w + 8 && pt.y >= m.y - h/2 - 8 && pt.y <= m.y + h/2 + 8) return i;
      }
    }
    return -1;
  }

  function cloneMarkCoords(m){
    if (m.type === 'point' || m.type === 'text') return { x: m.x, y: m.y };
    return { x1: m.x1, y1: m.y1, x2: m.x2, y2: m.y2 };
  }

  function applyMoveDelta(m, origin, dx, dy){
    if (m.type === 'point' || m.type === 'text'){
      m.x = origin.x + dx; m.y = origin.y + dy;
    } else {
      m.x1 = origin.x1 + dx; m.y1 = origin.y1 + dy;
      m.x2 = origin.x2 + dx; m.y2 = origin.y2 + dy;
    }
  }

  // -------- 캔버스 포인터(탭/드래그) 처리 --------
  let downClient = null; // 탭/드래그 판정은 화면(CSS) 좌표 기준으로 해야 캔버스 확대배율에 안 흔들림

  // 캔버스에서 발생하는 터치를 완전히 우리가 직접 처리(pointer 이벤트)하고,
  // 브라우저가 터치 이후 뒤늦게 만들어내는 "합성 마우스 클릭(ghost click)"을 원천 차단한다.
  // 이 합성 클릭이 막 열린 시트의 배경(sheetBackdrop)에 떨어져 시트를 바로 닫아버리는 바람에
  // "짧게 탭하면 안 먹고, 길게 눌러야만 인식되는" 것처럼 보이는 문제의 원인이었다.
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchend', (e) => { e.preventDefault(); }, { passive: false });

  canvas.addEventListener('pointerdown', (e) => {
    if(!baseImg) return;
    e.preventDefault();
    // 포인터 캡처를 항상 걸어야 함: 캡처가 없으면 모바일 브라우저가 "탭인지 스크롤/제스처인지"
    // 판단을 미루면서 짧은 탭의 pointerup을 지연·누락시켜 마치 길게 눌러야만 인식되는 것처럼 보임.
    canvas.setPointerCapture(e.pointerId);
    downPoint = getCanvasPoint(e);
    downClient = { x: e.clientX, y: e.clientY };
    downHitIndex = hitTest(downPoint);
    if ((currentTool === 'arrow' || currentTool === 'box') && downHitIndex < 0){
      dragging = true;
      dragShapeType = currentTool;
      dragStart = downPoint;
      dragCurrent = downPoint;
    } else if (currentTool === 'move' && downHitIndex >= 0){
      movingMark = true;
      moveIndex = downHitIndex;
      moveOrigin = cloneMarkCoords(marks[downHitIndex]);
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (dragging){
      dragCurrent = getCanvasPoint(e);
      redraw();
    } else if (movingMark){
      const cur = getCanvasPoint(e);
      applyMoveDelta(marks[moveIndex], moveOrigin, cur.x - downPoint.x, cur.y - downPoint.y);
      redraw();
    }
  });

  canvas.addEventListener('pointerup', (e) => {
    if(!baseImg) return;
    if (movingMark){
      movingMark = false; moveIndex = -1; moveOrigin = null;
      downPoint = null; downHitIndex = -1; downClient = null;
      showToast('위치를 이동했습니다');
      return;
    }
    if (!downPoint) return;
    const endPoint = getCanvasPoint(e);
    // 탭 판정: 손가락 떨림을 감안해 화면(CSS) 좌표 기준 12px 이내면 탭으로 취급
    const movedScreen = downClient ? Math.hypot(e.clientX - downClient.x, e.clientY - downClient.y) : 0;
    const isTap = movedScreen < 12;
    const moved = Math.hypot(endPoint.x - downPoint.x, endPoint.y - downPoint.y);

    if (dragging){
      dragging = false;
      if (moved > 20){
        marks.push({ type: dragShapeType, x1: dragStart.x, y1: dragStart.y, x2: endPoint.x, y2: endPoint.y, color: barColor, w: dragShapeType === 'arrow' ? barLine : 1 });
      }
      dragStart = null; dragCurrent = null; dragShapeType = null;
      redraw();
    } else if (downHitIndex >= 0 && isTap){
      openEditSheetByIndex(downHitIndex);
    } else if (isTap){
      pendingXY = downPoint;
      editingIndex = -1;
      if (currentTool === 'text') openNewTextSheet();
      else if (currentTool === 'point') addPointQuick(downPoint);
    }
    downPoint = null; downHitIndex = -1; downClient = null;
  });

  // -------- 포인트 입력 시트 --------
  function setJudge(j){
    currentJudge = j;
    id('segOk').classList.toggle('on', j==='ok');
    id('segNg').classList.toggle('on', j==='ng');
  }

  function renderSheetSize(kind, cur){
    sheetSizeKind = kind;
    const list = kind === 'point' ? POINT_SIZES : kind === 'line' ? LINE_SIZES : TEXT_SIZES;
    id('sizeLabel').innerText = kind === 'line' ? '굵기' : kind === 'text' ? '글자 크기' : '크기';
    id('sheetSizeBox').innerHTML = sizeBtns(kind, list, cur, 'setSheetSize');
    id('sizeFieldWrap').classList.remove('hidden');
  }
  function setSheetSize(v){
    currentSizeMul = v;
    if (editingIndex >= 0){
      const m = marks[editingIndex];
      if (m.type === 'arrow' || m.type === 'box') m.w = v; else m.sizeMul = v;
      redraw();
    }
    renderSheetSize(sheetSizeKind, v);
  }
  function renderSheetColor(cur){
    id('sheetColorStrip').innerHTML = colorBtns(cur, 'setSheetColor');
    id('colorFieldWrap').classList.remove('hidden');
  }
  function setSheetColor(c){
    if (editingIndex >= 0){
      marks[editingIndex].color = c;
      redraw();
    }
    renderSheetColor(c);
  }

  // -------- 측정값 칸 --------
  function renderVals(vals){
    const list = (vals || []).slice();
    while (list.length < 3) list.push('');
    id('valsBox').innerHTML = list.map((v, k) => `<input type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="${String(v).replace(/"/g, '&quot;')}" placeholder="측정${k + 1}">`).join('')
      + '<button type="button" onclick="addValBox()" aria-label="측정값 추가">＋</button>';
  }
  function addValBox(){
    const box = id('valsBox'), inputs = box.querySelectorAll('input');
    if (inputs.length >= 10) { showToast('측정값은 10개까지'); return; }
    const inp = document.createElement('input');
    inp.type = 'text'; inp.inputMode = 'decimal'; inp.autocomplete = 'off'; inp.placeholder = '측정' + (inputs.length + 1); inp.setAttribute('enterkeyhint', 'next');
    box.insertBefore(inp, box.lastElementChild); inp.focus();
  }
  // 적은 칸의 위치는 유지(측정1·측정3만 적어도 측정3 자리에 남음), 맨 뒤 빈 칸만 버림
  function readVals(){
    const v = [...id('valsBox').querySelectorAll('input')].map(i => i.value.trim());
    while (v.length && !v[v.length - 1]) v.pop();
    return v;
  }

  function openNewTextSheet(){
    sheetType = 'text';
    id('segOkngWrap').classList.add('hidden');
    id('memoFieldWrap').classList.remove('hidden');
    id('memoLabel').innerText = '글자 입력';
    id('memoInput').placeholder = '예: 크랙, 데이텀 A, 10.02mm';
    id('memoInput').value = '';
    id('sizeFieldWrap').classList.add('hidden');
    id('colorFieldWrap').classList.add('hidden');
    id('valsFieldWrap').classList.add('hidden');
    id('sheetTitle').innerText = '텍스트 추가';
    id('sheetActions').classList.remove('has-del');
    id('sheetActions').innerHTML = `
      <button type="button" class="btn-cancel" onclick="closeSheet()">취소</button>
      <button type="button" class="btn-confirm" onclick="confirmSheet()">확인</button>
    `;
    showSheet();
    setTimeout(() => { try { id('memoInput').focus(); } catch (e) {} }, 250);
  }

  function delActions(label){
    id('sheetActions').classList.add('has-del');
    id('sheetActions').innerHTML = `
      <button type="button" class="btn-del" onclick="deleteCurrent()">🗑 삭제</button>
      <button type="button" class="btn-cancel" onclick="closeSheet()">취소</button>
      <button type="button" class="btn-confirm" onclick="confirmSheet()">${label || '확인'}</button>
    `;
  }

  function openEditSheetByIndex(i){
    editingIndex = i;
    const m = marks[i];
    id('sizeFieldWrap').classList.add('hidden');
    id('colorFieldWrap').classList.add('hidden');

    if (m.type === 'arrow' || m.type === 'box'){
      sheetType = m.type;
      id('segOkngWrap').classList.add('hidden');
      id('memoFieldWrap').classList.add('hidden');
      id('valsFieldWrap').classList.add('hidden');
      renderSheetColor(m.color || ARROW_COLOR);
      if (m.type === 'arrow') renderSheetSize('line', m.w || 1);
      id('sheetTitle').innerText = (m.type === 'arrow' ? '화살표 수정' : '박스 수정');
      delActions('완료');
      showSheet();
      return;
    }

    if (m.type === 'text'){
      sheetType = 'text';
      currentSizeMul = m.sizeMul || 1;
      id('segOkngWrap').classList.add('hidden');
      id('memoFieldWrap').classList.remove('hidden');
      id('memoLabel').innerText = '글자 내용';
      id('memoInput').placeholder = '예: 크랙, 데이텀 A, 10.02mm';
      id('memoInput').value = m.text || '';
      renderSheetColor(m.color || '#111827');
      renderSheetSize('text', currentSizeMul);
      id('valsFieldWrap').classList.add('hidden');
      id('sheetTitle').innerText = '텍스트 수정';
      delActions();
      showSheet();
      return;
    }

    openPtSheet(i);
  }

  // -------- 포인트 입력창 (측정값 중심 · 다음/이전) --------
  let ptIndex = -1;
  function circ(n){ return n >= 1 && n <= 20 ? String.fromCharCode(0x2460 + n - 1) : String(n); }
  function pointsByNum(){ return marks.map((m, i) => ({ m, i })).filter(o => o.m.type === 'point').sort((a, b) => a.m.num - b.m.num); }
  function openPtSheet(i){
    ptIndex = i;
    const m = marks[i], list = pointsByNum(), pos = list.findIndex(o => o.i === i);
    id('ptNo').innerHTML = `${circ(m.num)}<small>/ ${list.length}</small>`;
    syncPtJudge();
    renderVals(m.vals || []);
    id('ptMemo').value = m.memo || '';
    id('ptItem').value = m.item || '';
    const prev = list[pos - 1], next = list[pos + 1];
    id('ptPrev').disabled = !prev;
    id('ptPrev').innerText = prev ? `◀ ${circ(prev.m.num)}` : '◀';
    id('ptNext').innerText = next ? `다음 ${circ(next.m.num)} ▶` : '완료 ✓';
    id('ptSheet').classList.add('show');
    id('sheetBackdrop').classList.add('show');
    redraw();
    // 키패드가 바로 뜨도록 탭 동작 안에서 곧바로 포커스
    const first = id('valsBox').querySelector('input');
    // 항목이 비어 있으면 항목부터 (항목 → 측정값 → 메모 순서)
    const target = !id('ptItem').value ? id('ptItem') : ([...id('valsBox').querySelectorAll('input')].find(x => !x.value) || first);
    try { target.focus({ preventScroll: true }); } catch (e) {}
  }
  function syncPtJudge(){
    const m = marks[ptIndex]; if (!m) return;
    id('ptOk').classList.toggle('on', m.judge !== 'ng');
    id('ptNg').classList.toggle('on', m.judge === 'ng');
  }
  function setPtJudge(j){
    const m = marks[ptIndex]; if (!m) return;
    m.judge = j;
    syncPtJudge(); redraw();
  }
  function savePt(){
    const m = marks[ptIndex]; if (!m) return;
    m.memo = id('ptMemo').value.trim();
    m.item = id('ptItem').value.trim();
    m.vals = readVals();
  }
  function ptGo(d){
    if (ptIndex < 0) return;
    savePt();
    const list = pointsByNum(), pos = list.findIndex(o => o.i === ptIndex), t = list[pos + d];
    if (t) openPtSheet(t.i);
    else if (d > 0) closePtSheet();
  }
  function closePtSheet(){
    if (ptIndex >= 0) savePt();
    ptIndex = -1;
    id('ptSheet').classList.remove('show');
    id('sheetBackdrop').classList.remove('show');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    redraw();
  }
  function deletePt(){
    const m = marks[ptIndex]; if (!m) return;
    if (!confirm(`${circ(m.num)} 포인트를 삭제할까요?\n(뒤 번호가 하나씩 당겨집니다)`)) return;
    marks.splice(ptIndex, 1);
    ptIndex = -1;
    renumber();
    id('ptSheet').classList.remove('show');
    id('sheetBackdrop').classList.remove('show');
    redraw();
    showToast('삭제했습니다');
  }
  // 키패드의 엔터(다음) → 다음 번호
  document.addEventListener('keydown', e => {
    if (ptIndex < 0 || e.key !== 'Enter' || e.isComposing) return;
    if (e.target && (e.target.id === 'ptItem' || e.target.id === 'ptMemo')) {
      e.preventDefault();
      const v = [...id('valsBox').querySelectorAll('input')];
      (v.find(x => !x.value) || v[0]).focus();
      return;
    }
    if (e.target && e.target.closest('#valsBox')) { e.preventDefault(); ptGo(1); }
  });

  function showSheet(){
    id('pointSheet').classList.add('show');
    id('sheetBackdrop').classList.add('show');
  }
  function closeSheet(){
    if (ptIndex >= 0){ closePtSheet(); return; }
    id('pointSheet').classList.remove('show');
    id('sheetBackdrop').classList.remove('show');
    pendingXY = null;
    editingIndex = -1;
  }

  function confirmSheet(){
    if (sheetType === 'point'){
      const memo = id('memoInput').value.trim();
      if (editingIndex >= 0){
        marks[editingIndex].judge = currentJudge;
        marks[editingIndex].memo = memo;
        marks[editingIndex].vals = readVals();
        marks[editingIndex].sizeMul = currentSizeMul;
      }
    } else if (sheetType === 'text'){
      const text = id('memoInput').value.trim();
      if (!text){ closeSheet(); return; }
      if (editingIndex >= 0){
        marks[editingIndex].text = text;
        marks[editingIndex].sizeMul = currentSizeMul;
      } else if (pendingXY){
        marks.push({ type: 'text', x: pendingXY.x, y: pendingXY.y, text, sizeMul: barTextSize, color: barColor, bg: barTextBg });
      }
    }
    // arrow/box는 색상 스와치를 탭하는 즉시 반영되므로 여기서는 시트만 닫음
    closeSheet();
    redraw();
  }

  function deleteCurrent(){
    if (editingIndex >= 0){
      marks.splice(editingIndex, 1);
      renumber();
    }
    closeSheet();
    redraw();
  }

  function renumber(){
    let n = 1;
    marks.forEach(m => { if (m.type === 'point') m.num = n++; });
    nextNum = n;
  }

  function undoMark(){
    if (marks.length === 0) return;
    marks.pop();
    renumber();
    redraw();
  }

  function clearMarks(){
    if (marks.length === 0) return;
    marks = [];
    nextNum = 1;
    redraw();
  }

  function resetPhoto(){
    baseImg = null;
    marks = [];
    nextNum = 1;
    setTool('point');
    id('markScreen').style.display = 'none';
    id('startScreen').style.display = 'flex';
    id('hdrSave').classList.remove('show'); document.body.classList.remove('marking');
    closeReport();
  }

  // -------- 저장 (이미지 + 범례 합성 후 공유/저장) --------
  function buildExportCanvas(){
    const points = marks.filter(m => m.type === 'point');
    const legendLineH = 30;
    const legendPad = 16;
    const legendH = points.length > 0 ? (legendPad*2 + points.length * legendLineH) : 0;
    const out = document.createElement('canvas');
    out.width = canvas.width;
    out.height = canvas.height + legendH;
    const octx = out.getContext('2d');
    octx.fillStyle = '#0b1636';
    octx.fillRect(0, 0, out.width, out.height);
    octx.drawImage(canvas, 0, 0);

    if (legendH > 0){
      let y = canvas.height + legendPad + 14;
      points.forEach(m => {
        octx.beginPath();
        octx.arc(legendPad + 10, y - 6, 11, 0, Math.PI*2);
        octx.fillStyle = JUDGE_COLOR[m.judge];
        octx.fill();
        octx.fillStyle = '#fff';
        octx.font = '900 11px -apple-system, sans-serif';
        octx.textAlign = 'center';
        octx.textBaseline = 'middle';
        octx.fillText(String(m.num), legendPad + 10, y - 5);

        octx.textAlign = 'left';
        octx.fillStyle = m.judge === 'ok' ? '#34d399' : '#fb7185';
        octx.font = '900 13px -apple-system, sans-serif';
        const label = m.judge === 'ok' ? 'OK' : 'NG';
        octx.fillText(label, legendPad + 30, y - 5);

        octx.fillStyle = 'rgba(255,255,255,.65)';
        octx.font = '600 12px -apple-system, sans-serif';
        octx.fillText(([m.item, m.memo].filter(Boolean).join(' · ') || '메모 없음') + (m.vals && m.vals.length ? '  ·  ' + m.vals.map(x => x || '–').join(' / ') : ''), legendPad + 66, y - 5);
        y += legendLineH;
      });
    }
    return out;
  }

  function dataURLtoBlob(dataUrl){
    const parts = dataUrl.split(',');
    const mimeMatch = parts[0].match(/data:(.*?);base64/);
    const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    const binary = atob(parts[1]);
    const arr = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  function triggerDownload(dataUrl, filename){
    // <a download> 클릭은 팝업 차단 대상이 아니라서 비동기 콜백 안에서도 안전하게 동작함
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast('갤러리(다운로드)에 저장되었습니다');
  }

  function saveImage(){
    if(!baseImg) return;
    const exportCanvas = buildExportCanvas();
    // toBlob(비동기) 대신 toDataURL(동기)을 사용 — 비동기 콜백 안에서 열던 새 창이
    // 모바일 브라우저의 팝업 차단에 걸려 "저장이 안 되는" 문제의 원인이었음
    const dataUrl = exportCanvas.toDataURL('image/jpeg', 0.92);
    const filename = `mark_${Date.now()}.jpg`;
    // 공유 시트(에어드롭/카톡 등 선택 화면)를 거치지 않고 즉시 다운로드해 갤러리에 바로 저장
    triggerDownload(dataUrl, filename);
  }

  // -------- 간이 성적서: 위 = 마킹 사진, 아래 = 번호별 측정값 표 --------
  function today(){ const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
  function reportRows(){ return marks.filter(m => m.type === 'point').sort((a, b) => a.num - b.num); }
  function tableText(){
    const rows = reportRows(), n = Math.max(1, ...rows.map(m => (m.vals || []).length));
    // [2026-09-30] 순서: No · 항목 · 측정1..n · 표시 · 메모
    const head = ['No', '항목', ...Array.from({ length: n }, (_, i) => '측정' + (i + 1)), '표시', '메모'];
    const pno = id('pnoInput').value.trim();
    const clean = v => String(v || '').replace(/[\t\n]/g, ' ');
    const lines = [`측정 기록\t${today()}${pno ? '\t품번: ' + pno : ''}`, head.join('\t')];
    rows.forEach(m => lines.push([m.num, clean(m.item), ...Array.from({ length: n }, (_, i) => (m.vals || [])[i] || ''), m.judge === 'ng' ? 'NG' : 'OK', clean(m.memo)].join('\t')));
    return lines.join('\n');
  }
  function buildReportCanvas(){
    const rows = reportRows(), n = Math.max(1, ...rows.map(m => (m.vals || []).length));
    const W = Math.max(900, Math.min(1400, canvas.width)), pad = Math.round(W * 0.035);
    const imgW = W - pad * 2, imgH = Math.round(canvas.height * imgW / canvas.width);
    const fs = Math.round(W * 0.022), rowH = Math.round(fs * 2.1), headH = Math.round(fs * 3.4);
    const tableH = rowH * (rows.length + 1);
    const out = document.createElement('canvas');
    out.width = W; out.height = headH + imgH + pad + tableH + pad + Math.round(fs * 2.2);
    const g = out.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, out.height);
    // 머리글
    const pno = id('pnoInput').value.trim();
    g.fillStyle = '#0b1636'; g.font = `900 ${Math.round(fs * 1.25)}px -apple-system, sans-serif`; g.textBaseline = 'middle'; g.textAlign = 'left';
    g.fillText('측정 기록' + (pno ? '  ·  ' + pno : ''), pad, headH / 2);
    g.fillStyle = '#64748b'; g.font = `700 ${fs}px -apple-system, sans-serif`; g.textAlign = 'right';
    g.fillText(today(), W - pad, headH / 2);
    // 사진
    g.drawImage(canvas, pad, headH, imgW, imgH);
    g.strokeStyle = '#e2e8f0'; g.lineWidth = 2; g.strokeRect(pad, headH, imgW, imgH);
    // 표
    const y0 = headH + imgH + pad;
    // [2026-09-30] 순서: No · 항목 · 측정1..n · 표시 · 메모 (모든 칸 가운데 정렬)
    const hasItem = rows.some(m => m.item);
    const cNo = Math.round(fs * 3), cItem = Math.round(fs * (hasItem ? 7 : 5)), cJ = Math.round(fs * 3.6), vW = Math.round(fs * 5.2);
    const valsW = vW * n, memoW = Math.max(fs * 6, imgW - cNo - cItem - cJ - valsW);
    const total = cNo + cItem + valsW + cJ + memoW;
    const scale = total > imgW ? imgW / total : 1;
    const cols = [['No', cNo * scale], ['항목', cItem * scale], ...Array.from({ length: n }, (_, i) => ['측정' + (i + 1), vW * scale]), ['표시', cJ * scale], ['메모', memoW * scale]];
    const judgeCol = 2 + n;
    let y = y0;
    g.fillStyle = '#0b1636'; g.fillRect(pad, y, imgW, rowH);
    let x = pad;
    g.font = `800 ${fs}px -apple-system, sans-serif`; g.fillStyle = '#e0b060'; g.textAlign = 'center';
    cols.forEach(([t, w]) => { g.fillText(t, x + w / 2, y + rowH / 2); x += w; });
    y += rowH;
    rows.forEach((m, ri) => {
      g.fillStyle = ri % 2 ? '#f8fafc' : '#ffffff'; g.fillRect(pad, y, imgW, rowH);
      const ng = m.judge === 'ng';
      const cells = [String(m.num), m.item || '', ...Array.from({ length: n }, (_, i) => (m.vals || [])[i] || ''), ng ? 'NG' : 'OK', m.memo || ''];
      x = pad;
      cells.forEach((t, ci) => {
        const w = cols[ci][1];
        g.fillStyle = ci === judgeCol ? (ng ? '#dc2626' : '#16a34a') : (ng ? '#b91c1c' : '#0f172a');
        g.font = `${ci === 0 || ci === judgeCol ? 900 : 700} ${fs}px -apple-system, sans-serif`;
        let str = String(t);
        while (str.length > 1 && g.measureText(str).width > w - fs * 0.6) str = str.slice(0, -2) + '…';
        g.textAlign = 'center'; g.fillText(str, x + w / 2, y + rowH / 2);
        x += w;
      });
      g.strokeStyle = '#e2e8f0'; g.lineWidth = 1; g.beginPath(); g.moveTo(pad, y + rowH); g.lineTo(pad + imgW, y + rowH); g.stroke();
      y += rowH;
    });
    // 세로 칸 구분선
    x = pad; g.strokeStyle = '#e2e8f0'; g.lineWidth = 1;
    cols.slice(0, -1).forEach(([, w]) => { x += w; g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y0 + tableH); g.stroke(); });
    g.strokeStyle = '#cbd5e1'; g.lineWidth = 1.5; g.strokeRect(pad, y0, imgW, tableH);
    g.fillStyle = '#94a3b8'; g.font = `600 ${Math.round(fs * 0.8)}px -apple-system, sans-serif`; g.textAlign = 'left';
    g.fillText('※ 현장 기록 · 정식 성적서는 PC에서 작성', pad, y + pad * 0.5 + fs);
    return out;
  }
  let reportUrl = '';
  function openReport(){
    if (!hasVals()) { showToast('측정값이 있는 포인트가 없습니다'); return; }
    reportUrl = buildReportCanvas().toDataURL('image/jpeg', 0.92);
    id('rpImg').src = reportUrl;
    id('rpWrap').classList.add('show');
  }
  function closeReport(){ id('rpWrap').classList.remove('show'); }
  async function copyText(t){
    try { await navigator.clipboard.writeText(t); return true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (x) {} ta.remove(); return ok;
    }
  }
  async function copyTable(){ showToast(await copyText(tableText()) ? '표를 복사했습니다 · PC 엑셀에 붙여넣으면 칸이 나뉩니다' : '복사에 실패했습니다'); }
  function saveReport(){ triggerDownload(reportUrl, `측정기록_${today()}.jpg`); }
  async function shareReport(){
    const text = tableText();
    await copyText(text);   // 카톡은 사진과 글을 같이 보내면 글이 빠질 수 있어 먼저 복사해 둠
    try {
      const file = new File([dataURLtoBlob(reportUrl)], `측정기록_${today()}.jpg`, { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text, title: '측정 기록' });
        showToast('표 글자는 복사되어 있습니다 · 필요하면 붙여넣으세요');
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    saveReport();
    showToast('사진은 저장, 표는 복사했습니다');
  }

  let toastTimer = null;
  function showToast(msg){
    const t = id('toast');
    t.innerText = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }
</script>
